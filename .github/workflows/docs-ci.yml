name: Docs CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout Edge Kit authority
        uses: actions/checkout@v4
        with:
          repository: AtomGradient/edge-kit
          path: .ci-deps/edge-kit

      - name: Checkout Edge Scaffold authority
        uses: actions/checkout@v4
        with:
          repository: AtomGradient/edge-scaffold
          path: .ci-deps/edge-scaffold

      - name: Checkout Edge Halo binary authority
        uses: actions/checkout@v4
        with:
          repository: AtomGradient/edge-halo-binary
          path: .ci-deps/edge-halo-binary

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: npm ci

      - name: Install current Edge Studio CLI
        run: |
          set -euo pipefail
          EDGE_STUDIO_VERSION="$(python3 scripts/check_versions.py --print edge-studio)"
          python -m pip install --upgrade pip
          python -m pip install --no-deps "edge-studio==${EDGE_STUDIO_VERSION}"
          python -m pip install "platformdirs>=4.0"

      - name: Run docs guards
        run: npm run docs:check

      - name: Build docs
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
